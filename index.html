<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="game">
            <div class="info__game">

                <div class="box">
                    <div class="wrap__info-game">
                        <p class="losted">Losted: 0</p>
                        <p class="hitted">Hitted: 0</p>
                        <p class="timer">Time 0</p>
                    </div>
                    <div class="figure"></div>
                </div>
            </div>
            <button class="start">Start</button>
            <button class="stop start">Stop</button>
            <div class="wrap__modes">
                <div class="modes">
                    <button class="easy mode">Easy</button>
                    <button class="medium mode">Medium</button>
                    <button class="hard mode">Hard</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
